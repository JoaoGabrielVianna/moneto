services:
  moneto-database:
    image: postgres:15
    container_name: ${POSTGRES_DB}
    restart: always
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - moneto_data:/var/lib/postgresql/data
    networks:
      - moneto_network
  
networks:
  moneto_network:
    driver: bridge

volumes:
  moneto_data: